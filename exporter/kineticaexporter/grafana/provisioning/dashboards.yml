# Grafana provisioning of the v2 metrics dashboards. Copy grafana/dashboards
# to the path below, and this file to Grafana's provisioning/dashboards
# directory. The dashboards use the default instance of the Kinetica
# datasource plugin (kinetica-datasource), through their DS_KINETICA variable.
apiVersion: 1

providers:
  - name: kinetica-otel-metrics
    folder: OpenTelemetry on Kinetica
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/kinetica-otel
